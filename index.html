#gfxp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px;display:flex;flex-direction:column;gap:12px;width:min(90%,420px);max-height:90vh;overflow-y:auto;text-align:center}
#gfxp h2{margin:0 0 4px}#gfxp .gqdrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}#gfxp .gqdrow .btn{flex:1;min-width:105px;font-size:12px;padding:9px 6px}
#grdinfo{font-size:12px;line-height:1.4;opacity:.85}
#multi{background:rgba(0,0,0,.82);pointer-events:auto;z-index:30}
#mpbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,390px);max-height:88vh;overflow:auto;background:rgba(20,20,40,.96);border:4px solid #000;padding:20px;text-align:center;display:flex;flex-direction:column;gap:12px}
#mpbox input{font:inherit;font-size:16px;padding:13px;border:3px solid #000;background:#222;color:#fff;width:100%;text-align:center;text-transform:uppercase}
#mpstatus{font-size:12px;line-height:1.5;min-height:34px;color:#b8e99c}#mpcode{font-size:26px;letter-spacing:5px;color:#f5c518;font-weight:bold}#bnet{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);font-size:clamp(13px,3.5vmin,17px)}
